<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Битва полководцев | Поле боя</title>
    <meta name="description" content="Логическая пошаговая стратегия с тремя армиями">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div class="game">
        <div class="header">
            <h1><span class="title-emoji">️</span>
                <span class="title-gradient">ПОЛЕ БОЯ</span>
                <span class="title-emoji">⚔️</span>
           </h1>
            <div class="header-controls">
                <button class="icon-btn sound-btn" id="soundBtn" aria-label="Включить/выключить звук">🔊</button>
                <button class="icon-btn exit-btn" id="exitBtn" aria-label="Выйти в меню">✕</button>
            </div>
        </div>

        <div class="score">
            <div class="score-item">
                <span class="lbl">👤 ИГРОК</span>
                <span class="val" id="playerScore">0</span>
            </div>
            <div class="diff-badge" id="difficultyBadge">⏳ ЗАГРУЗКА...</div>
            <div class="score-item">
                <span class="lbl">🤖 КОМПЬЮТЕР</span>
                <span class="val" id="computerScore">0</span>
            </div>
        </div>

        <div class="board-wrap">
            <canvas id="boardCanvas"></canvas>
        </div>

        <div class="placement-panel" id="placementPanel">
            <div class="color-selector" id="colorSelector"></div>
            <div class="medium-place" id="mediumPlace" style="display:none;">
                <div class="medium-piece" id="mediumPiece"></div>
                <div class="medium-text" id="mediumText"></div>
            </div>
        </div>

        <div class="game-info" id="gameInfo">
            <div class="game-info-turn" id="turnIndicator">⚡ ХОДИТ: ИГРОК</div>
            <div class="game-info-msg" id="gameMessage">🎮 Ваш ход. Выберите шашку</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
