<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Битва полководцев | Статистика</title>
    <meta name="description" content="Статистика побед в игре">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/stats.css">
    <!-- Yandex Games SDK (временно отключён) -->
    <!-- <script src="https://sdk.games.s3.yandex.net/sdk.js"></script> -->
</head>
<body class="stats-page">
    <div class="stats-container">
        <h1 class="stats-title">
            <span class="stats-title-emoji">📊</span>
            <span class="stats-title-gradient">СТАТИСТИКА</span>
        </h1>

        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-card-label">👤 ПОБЕД ИГРОКА</div>
                <div class="stats-card-value" id="playerWins">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-card-label">🤖 ПОБЕД КОМПЬЮТЕРА</div>
                <div class="stats-card-value" id="computerWins">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-card-label">🎮 ВСЕГО ИГР</div>
                <div class="stats-card-value" id="totalGames">0</div>
            </div>
        </div>

        <div class="stats-table">
            <table>
                <thead>
                    <tr>
                        <th>СЛОЖНОСТЬ</th>
                        <th>ПОБЕД ИГРОКА</th>
                        <th>ПОБЕД КОМПЬЮТЕРА</th>
                        <th>СЫГРАНО</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>🟢 ЛЁГКАЯ</td><td id="easyPlayer">0</td><td id="easyComputer">0</td><td id="easyTotal">0</td></tr>
                    <tr><td>🟡 СРЕДНЯЯ</td><td id="mediumPlayer">0</td><td id="mediumComputer">0</td><td id="mediumTotal">0</td></tr>
                    <tr><td>🔴 СЛОЖНАЯ</td><td id="hardPlayer">0</td><td id="hardComputer">0</td><td id="hardTotal">0</td></tr>
                </tbody>
            </table>
        </div>

        <div class="stats-btn-group">
            <button class="stats-btn-leaderboard" id="leaderboardBtn">🏆 ТАБЛИЦА ЛИДЕРОВ</button>
            <button class="stats-btn-reset" id="resetStatsBtn">🗑 СБРОСИТЬ СТАТИСТИКУ</button>
            <button class="stats-btn-back" id="backBtn">🏠 НА ГЛАВНУЮ</button>
        </div>
        
        <div class="stats-footer">
            <p class="stats-footer-copyright">© 2026 БИТВА ПОЛКОВОДЦЕВ. Все права защищены.</p>
            <p class="stats-footer-privacy"><a href="privacy.html" style="color:#666; text-decoration:none; font-size:11px;">🔒 Политика конфиденциальности</a></p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/yandex.js"></script>
    <script src="js/stats.js"></script>
</body>
</html>
