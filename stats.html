<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Битва полководцев | Статистика</title>
    <meta name="description" content="Статистика побед в игре">
    <link rel="stylesheet" href="style.css">
    <!-- Yandex Games SDK (временно отключён для локальной разработки) -->
    <!-- <script src="https://sdk.games.s3.yandex.net/sdk.js"></script> -->
</head>
<body>
    <div class="container stats-container">
        <h1>
            <span class="title-emoji">📊</span>
            <span class="title-gradient">СТАТИСТИКА</span>
        </h1>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">👤 ПОБЕД ИГРОКА</div>
                <div class="value" id="playerWins">0</div>
            </div>
            <div class="stat-card">
                <div class="label">🤖 ПОБЕД КОМПЬЮТЕРА</div>
                <div class="value" id="computerWins">0</div>
            </div>
            <div class="stat-card">
                <div class="label">🎮 ВСЕГО ИГР</div>
                <div class="value" id="totalGames">0</div>
            </div>
        </div>

        <div class="stats-table">
            <table>
                <thead>
                    <tr>
                        <th>СЛОЖНОСТЬ</th>
                        <th>ПОБЕД ИГРОКА</th>
                        <th>ПОБЕД КОМПЬЮТЕРА</th>
                        <th>СЫГРАНО</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>🟢 ЛЁГКАЯ</td><td id="easyPlayer">0</td><td id="easyComputer">0</td><td id="easyTotal">0</td></tr>
                    <tr><td>🟡 СРЕДНЯЯ</td><td id="mediumPlayer">0</td><td id="mediumComputer">0</td><td id="mediumTotal">0</td></tr>
                    <tr><td>🔴 СЛОЖНАЯ</td><td id="hardPlayer">0</td><td id="hardComputer">0</td><td id="hardTotal">0</td></tr>
                </tbody>
            </table>
        </div>

        <div class="button-group">
            <button class="btn btn-reset" id="resetStatsBtn">🗑 СБРОСИТЬ СТАТИСТИКУ</button>
            <button class="btn btn-back" id="backBtn">🏠 НА ГЛАВНУЮ</button>
        </div>
        
        <div class="footer">
            <p class="copyright">© 2024 БИТВА ПОЛКОВОДЦЕВ. Все права защищены.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
